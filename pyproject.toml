[project]
name = "radio_curator"
version = "0.0.1"
description = "BBC radio show downloader and playlist curator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "mutagen>=1.47.0",
    "requests>=2.32.5",
    "ytmusicapi>=1.11.4",
]

[project.scripts]
radio-curator = "radio_curator.main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mock>=4.0.0",
]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.6.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "types-requests>=2.32.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.ruff]
line-length = 90

[tool.pylint.format]
max-line-length = 90

[tool.pylint.design]
max-args = 6
max-locals = 40
max-branches = 35
max-statements = 105
max-nested-blocks = 6
max-positional-arguments = 6
